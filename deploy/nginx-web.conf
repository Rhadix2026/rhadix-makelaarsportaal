# nginx in de web-container: statische webinterface en /api/ naar de API-container.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Uploads: brochure tot 150 MB (MAX_GROOTTE in api/src/opslag.ts). Let op: Cloudflare (Free/Pro)
  # laat per verzoek maximaal 100 MB door.
  client_max_body_size 160m;

  location /api/ {
    proxy_pass http://api:8480;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Beveiligingsheaders van de API zelf (o.a. de sandbox-CSP van de preview) blijven ongewijzigd.
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Logo's van de organisatie komen van het Rhadix-platform (branding-claim, /api/branding/<id>/logo).
    # De preview (iframe) komt van dezelfde herkomst (/api/voorbeeld/…) en draait daar in een sandbox.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://app.rhadix.nl https://app-staging.rhadix.nl; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri /index.html;
  }
}
