# Systemd-drop-in zolang alleen de testomgeving draait (demo op één CPX32).
# Installeren in /etc/systemd/system/makelaarsportaal-{back-up,hersteltest,meting}.service.d/
# en verwijderen zodra productie draait (dan gelden de standaardpaden van productie).
[Service]
Environment=MP_OMG=/srv/makelaarsportaal-test
Environment=MP_PROJECT=makelaarsportaal-test
