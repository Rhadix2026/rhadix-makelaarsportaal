# Host-nginx op de makelaarsportaal-server. Alleen bereikbaar via Cloudflare (Hetzner Cloud
# Firewall: 443 alleen voor de Cloudflare-adressen). TLS met een Cloudflare-origincertificaat
# voor deze hostnamen (Full strict). Elke omgeving stuurt door naar zijn eigen web-container.

# Echte bezoekers-IP alleen uit de Cloudflare-header (lijst: https://www.cloudflare.com/ips/).
# Bij het inrichten bijwerken met: deploy/server/cloudflare-ips.sh > /etc/nginx/conf.d/cloudflare-ips.conf
include /etc/nginx/conf.d/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

server_tokens off;

server {
  listen 443 ssl;
  http2 on;
  server_name makelaarsportaal.rhadix.nl;
  ssl_certificate     /etc/ssl/makelaarsportaal/origin.pem;
  ssl_certificate_key /etc/ssl/makelaarsportaal/origin.key;
  client_max_body_size 160m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location / {
    proxy_pass http://127.0.0.1:8580;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name makelaarsportaal-test.rhadix.nl;
  ssl_certificate     /etc/ssl/makelaarsportaal/origin.pem;
  ssl_certificate_key /etc/ssl/makelaarsportaal/origin.key;
  client_max_body_size 160m;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location / {
    proxy_pass http://127.0.0.1:8581;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }
}

# Al het andere (directe IP-toegang, onbekende namen): verbinding weigeren.
server {
  listen 443 ssl default_server;
  ssl_reject_handshake on;
}
