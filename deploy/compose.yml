# Rhadix Makelaarsportaal: online omgeving (één Compose-project per omgeving).
#
#   productie:  docker compose -p makelaarsportaal      --env-file /srv/makelaarsportaal/.env      -f compose.yml up -d
#   test:       docker compose -p makelaarsportaal-test --env-file /srv/makelaarsportaal-test/.env -f compose.yml up -d
#
# Alle gegevens staan onder MP_DATA (database, opslag) op de server; het SigLIP-model alleen-lezen
# onder MP_MODELLEN. Alleen de web-container publiceert een poort, en alleen op 127.0.0.1: de
# host-nginx (met het Cloudflare-origincertificaat) stuurt het verkeer door.
name: ${COMPOSE_PROJECT_NAME:-makelaarsportaal}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app: &app
  image: makelaarsportaal-app:${MP_TAG:?MP_TAG ontbreekt}
  restart: unless-stopped
  logging: *logging
  depends_on:
    db: { condition: service_healthy }
  volumes:
    - ${MP_DATA:?MP_DATA ontbreekt}/opslag:/srv/opslag
    - ${MP_MODELLEN:?MP_MODELLEN ontbreekt}/hf:/opt/generator/.cache/ai/hf:ro
  environment: &app-env
    STUDIO_DB_URL: postgres://studio:${MP_DB_WACHTWOORD:?MP_DB_WACHTWOORD ontbreekt}@db:5432/studio
    STUDIO_OMGEVING: ${MP_OMGEVING:-productie}
    STUDIO_HERKOMST: ${MP_HERKOMST:?MP_HERKOMST ontbreekt}
    STUDIO_COOKIE_SECURE: ${MP_COOKIE_SECURE:-1}
    STUDIO_INACTIVITEIT_MIN: "5"
    # Centrale Rhadix-login: alleen de PUBLIEKE sleutel van het platform (test: Datavalidatie staging).
    STUDIO_SSO_SLEUTEL: ${MP_SSO_SLEUTEL:-}
    STUDIO_SSO_PLATFORM: ${MP_SSO_PLATFORM:-}
    STUDIO_SSO_COOKIE: ${MP_SSO_COOKIE:-rhadix_sso}
    STUDIO_SSO_APP: ${MP_SSO_APP:-rhadix-makelaarsportaal}
    # Eigen login online alleen als noodtoegang via een SSH-tunnel (zie LEESMIJ).
    STUDIO_LOKALE_LOGIN: ${MP_LOKALE_LOGIN:-tunnel}
    TZ: Europe/Amsterdam

services:
  db:
    # Zelfde image als lokaal (postgres 16, vastgezet op digest; multi-arch).
    image: postgres@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${MP_DB_WACHTWOORD:?MP_DB_WACHTWOORD ontbreekt}
      TZ: Europe/Amsterdam
    volumes:
      - ${MP_DATA}/db:/var/lib/postgresql/data
    networks: [intern]
    mem_limit: ${MP_DB_GEHEUGEN:-1g}
    cpus: ${MP_DB_CPUS:-2}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    <<: *app
    environment:
      <<: *app-env
      STUDIO_ROL: api
    networks: [intern, web]
    mem_limit: ${MP_API_GEHEUGEN:-1536m}
    cpus: ${MP_API_CPUS:-2}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8480/api/gezond"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  verwerker:
    <<: *app
    command: ["node_modules/.bin/tsx", "api/src/verwerker.ts"]
    environment:
      <<: *app-env
      STUDIO_ROL: verwerker
    # Alleen het interne netwerk: geen verbinding naar buiten (de generatie gebruikt geen externe bronnen).
    networks: [intern]
    # Beeldclassificatie plus importproces (gemeten piek Markt 27: 3,0 GB); generatie met Chromium
    # ±2,7 GB. Eén verwerking tegelijk (de wachtrij pakt alleen iets op als er niets 'bezig' is).
    # Grenzen per servertype in .env (zie env.voorbeeld); cpus mag niet hoger zijn dan het aantal kernen.
    # memswap_limit hoger dan mem_limit: een korte piek gaat naar swap in plaats van een OOM-stop.
    mem_limit: ${MP_VERWERKER_GEHEUGEN:-6g}
    memswap_limit: ${MP_VERWERKER_GEHEUGEN_SWAP:-6g}
    cpus: ${MP_VERWERKER_CPUS:-6}
    stop_grace_period: 3m

  web:
    image: makelaarsportaal-web:${MP_TAG}
    restart: unless-stopped
    logging: *logging
    depends_on: [api]
    networks: [web]
    ports:
      - "127.0.0.1:${MP_POORT:?MP_POORT ontbreekt}:8080"
    mem_limit: 128m
    cpus: 1

networks:
  intern:
    internal: true
  web: {}
